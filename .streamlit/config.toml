# D36: a monospace document on white paper, black ink, no colour accent.
[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
textColor = "#111111"
linkColor = "#111111"
borderColor = "#d4d4d4"
dataframeBorderColor = "#e4e4e4"
dataframeHeaderBackgroundColor = "#f4f4f4"
codeBackgroundColor = "#f4f4f4"
codeTextColor = "#111111"
font = "Source Code Pro:https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600&display=swap"
codeFont = "Source Code Pro:https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600&display=swap"
headingFontWeights = [500, 500, 500, 500, 500, 500]
baseFontSize = 15
baseRadius = "0px"
buttonRadius = "0px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#f0f0f0"
showSidebarBorder = true
